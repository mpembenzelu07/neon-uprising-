<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NEON UPRISING</title>
  
  <!-- Load Tailwind for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Three.js for 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap');
    body { margin: 0; overflow: hidden; background: #05070d; color: white; font-family: 'Rajdhani', sans-serif; }
    .font-display { font-family: 'Orbitron', sans-serif; }
    canvas { display: block; }
    .glass { background: rgba(10, 20, 35, 0.85); border: 1px solid rgba(0, 240, 255, 0.3); }
    .neon-cyan { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
    .neon-pink { color: #ff00a0; text-shadow: 0 0 10px #ff00a0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-black z-50">
    <div class="text-center">
      <h1 class="font-display text-4xl neon-cyan tracking-widest animate-pulse">NEON UPRISING</h1>
      <p class="mt-4 text-cyan-300">INITIALIZING WORLD...</p>
    </div>
  </div>

  <!-- CHARACTER SELECTION -->
  <div id="char-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-black/90 z-40 hidden">
    <h1 class="font-display text-4xl neon-cyan mb-8 tracking-widest">CHOOSE YOUR OPERATIVE</h1>
    <div id="char-container" class="flex gap-6 flex-wrap justify-center"></div>
  </div>

  <!-- GAME UI -->
  <div id="game-ui" class="fixed inset-0 z-10 hidden pointer-events-none">
    <div class="absolute top-4 left-4 glass p-4 rounded-xl pointer-events-auto">
      <p class="text-cyan-400 text-xs tracking-widest">OPERATIVE</p>
      <h2 id="ui-char" class="font-display text-xl neon-cyan">—</h2>
    </div>
    <div class="absolute top-4 right-4 glass p-4 rounded-xl text-right pointer-events-auto">
      <p class="text-cyan-400 text-xs tracking-widest">CREDS</p>
      <h2 id="ui-money" class="font-display text-2xl neon-pink">1,000</h2>
    </div>
    <div class="absolute bottom-4 left-4 glass p-4 rounded-xl pointer-events-auto text-sm text-cyan-200">
      WASD to move. Walk into the glowing cyan circle to earn money.
    </div>
  </div>

  <!-- THE GAME SCRIPT -->
  <script>
    // 1. Game State
    let scene, camera, renderer, player;
    let money = 1000;
    let selectedChar = null;
    let keys = {};
    let missions = [];
    let clock = new THREE.Clock();

    const characters = [
      { id: 'fixer', name: 'THE FIXER', color: '#ff3366', desc: 'Earns more from transport.' },
      { id: 'ghost', name: 'THE GHOST', color: '#00f0ff', desc: 'Escapes police faster.' },
      { id: 'netrunner', name: 'THE NETRUNNER', color: '#b44cff', desc: 'Unlocks hacking chores.' }
    ];

    // 2. UI Logic
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('char-screen').classList.remove('hidden');
      
      const container = document.getElementById('char-container');
      characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'glass p-6 rounded-xl cursor-pointer hover:scale-105 transition-transform text-center w-64';
        card.style.borderColor = char.color;
        card.innerHTML = `
          <div class="w-16 h-16 rounded-full mx-auto mb-4" style="background:${char.color}; box-shadow: 0 0 20px ${char.color};"></div>
          <h3 class="font-display text-xl mb-2" style="color:${char.color};">${char.name}</h3>
          <p class="text-sm text-gray-300">${char.desc}</p>
          <button class="mt-4 w-full py-2 rounded bg-black/50 border border-cyan-500 text-cyan-300">SELECT</button>
        `;
        card.onclick = () => startGame(char);
        container.appendChild(card);
      });
    }, 1000);

    // 3. Start Game
    function startGame(char) {
      selectedChar = char;
      document.getElementById('char-screen').classList.add('hidden');
      document.getElementById('game-ui').classList.remove('hidden');
      document.getElementById('ui-char').innerText = char.name;
      updateMoneyUI();

      // Setup Three.js
      scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x05070d, 20, 100);
      
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x05070d);
      document.body.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));
      const dirLight = new THREE.DirectionalLight(0x00f0ff, 1);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Ground
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x0a1220 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Player
      const playerGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 16);
      const playerMat = new THREE.MeshStandardMaterial({ color: char.color, emissive: char.color, emissiveIntensity: 0.5 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.set(0, 1, 0);
      scene.add(player);

      // Spawn Mission Markers
      spawnMission(10, 0);
      spawnMission(-15, 10);
      spawnMission(0, -20);

      // Event Listeners
      window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Start Loop
      animate();
    }

    // 4. Game Logic
    function spawnMission(x, z) {
      const geo = new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32);
      const mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.8 });
      const marker = new THREE.Mesh(geo, mat);
      marker.position.set(x, 0.1, z);
      scene.add(marker);
      
      const beam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.2, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.2 })
      );
      beam.position.y = 5;
      marker.add(beam);

      missions.push(marker);
    }

    function updateMoneyUI() {
      document.getElementById('ui-money').innerText = money.toLocaleString();
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      if (player) {
        // Movement
        const speed = keys['shift'] ? 20 : 10;
        if (keys['w'] || keys['arrowup']) player.position.z -= speed * dt;
        if (keys['s'] || keys['arrowdown']) player.position.z += speed * dt;
        if (keys['a'] || keys['arrowleft']) player.position.x -= speed * dt;
        if (keys['d'] || keys['arrowright']) player.position.x += speed * dt;

        // Camera Follow
        const targetCamPos = new THREE.Vector3(player.position.x, player.position.y + 8, player.position.z + 12);
        camera.position.lerp(targetCamPos, 0.1);
        camera.lookAt(player.position);

        // Check Mission Collisions
        for (let i = missions.length - 1; i >= 0; i--) {
          const m = missions[i];
          m.rotation.y += dt;
          
          const dist = player.position.distanceTo(m.position);
          if (dist < 2) {
            // Collect mission
            money += 500;
            updateMoneyUI();
            scene.remove(m);
            missions.splice(i, 1);
            
            // Spawn a new one elsewhere
            setTimeout(() => {
              spawnMission((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40);
            }, 1000);
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
