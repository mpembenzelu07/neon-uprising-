<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- THIS FORCES THE PHONE TO NEVER CACHE THE GAME -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>NEON UPRISING: REALITY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');
    body { margin: 0; overflow: hidden; background: #05070d; color: white; font-family: 'Rajdhani', sans-serif; touch-action: none; }
    .font-display { font-family: 'Orbitron', sans-serif; }
    canvas { display: block; }
    .glass { background: rgba(10, 20, 35, 0.8); border: 1px solid rgba(0, 240, 255, 0.3); backdrop-filter: blur(8px); }
    .neon-cyan { color: #00f0ff; text-shadow: 0 0 15px #00f0ff; }
    .neon-pink { color: #ff00a0; text-shadow: 0 0 15px #ff00a0; }
    .hidden { display: none !important; }
    
    /* Mobile Controls */
    .d-pad-btn {
      width: 50px; height: 50px; background: rgba(0, 240, 255, 0.15); 
      border: 2px solid #00f0ff; border-radius: 12px; display: flex; 
      align-items: center; justify-content: center; user-select: none;
      font-size: 20px; color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,0.3);
    }
    .d-pad-btn:active { background: rgba(0, 240, 255, 0.6); }
    
    .action-btn {
      width: 65px; height: 65px; border-radius: 50%; display: flex; 
      align-items: center; justify-content: center; user-select: none;
      font-size: 26px; border: 2px solid; box-shadow: 0 0 15px rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
    }
    .action-btn:active { transform: scale(0.9); }
    
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
      border: 2px solid #00f0ff; border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 20; box-shadow: 0 0 10px #00f0ff inset;
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading" class="fixed inset-0 flex flex-col items-center justify-center bg-black z-50">
    <h1 class="font-display text-4xl neon-cyan tracking-widest animate-pulse">NEON UPRISING</h1>
    <p class="mt-4 text-cyan-300 font-bold tracking-widest">VERSION 3.0 - LOADING...</p>
  </div>

  <!-- CHARACTER SELECT -->
  <div id="char-screen" class="fixed inset-0 flex flex-col items-center justify-center bg-black/90 z-40 hidden p-4 overflow-y-auto">
    <h1 class="font-display text-3xl md:text-5xl neon-cyan mb-8 tracking-widest text-center">CHOOSE YOUR OPERATIVE</h1>
    <div id="char-container" class="flex flex-col md:flex-row gap-4 w-full max-w-5xl justify-center pb-10"></div>
  </div>

  <!-- GAME UI -->
  <div id="game-ui" class="fixed inset-0 z-10 hidden pointer-events-none">
    <!-- Top HUD -->
    <div class="absolute top-4 left-4 flex gap-2">
      <div class="glass p-3 rounded-xl pointer-events-auto flex items-center gap-4">
        <div>
          <p class="text-cyan-400 text-xs tracking-widest">OPERATIVE</p>
          <h2 id="ui-char" class="font-display text-lg neon-cyan">—</h2>
        </div>
        <!-- NEW PAUSE BUTTON -->
        <button id="btn-pause" class="bg-red-500/20 border border-red-500 text-red-300 px-3 py-1 rounded hover:bg-red-500/40 text-sm font-bold">EXIT</button>
      </div>
      <div class="glass p-3 rounded-xl pointer-events-auto">
        <p class="text-red-400 text-xs tracking-widest">HEALTH</p>
        <h2 id="ui-health" class="font-display text-lg text-red-500">100%</h2>
      </div>
    </div>
    
    <div class="absolute top-4 right-4 flex gap-2">
      <div class="glass p-3 rounded-xl text-right pointer-events-auto">
        <p class="text-cyan-400 text-xs tracking-widest">WEAPON</p>
        <h2 id="ui-weapon" class="font-display text-sm text-pink-400">Pistol</h2>
      </div>
      <div class="glass p-3 rounded-xl text-right pointer-events-auto">
        <p class="text-cyan-400 text-xs tracking-widest">CREDS</p>
        <h2 id="ui-money" class="font-display text-2xl neon-pink">1,000</h2>
      </div>
    </div>
    
    <div id="crosshair" class="hidden"></div>

    <div id="prompt" class="absolute top-1/3 left-1/2 -translate-x-1/2 glass px-6 py-2 rounded-lg hidden border-cyan-400 border-2 bg-black/80">
      <span class="text-cyan-300 font-bold tracking-widest text-sm" id="prompt-text">INTERACT</span>
    </div>

    <!-- Mobile Controls -->
    <div class="absolute bottom-6 left-6 flex flex-col items-center gap-1 pointer-events-auto md:hidden z-30">
      <div class="d-pad-btn" id="btn-w">▲</div>
      <div class="flex gap-1">
        <div class="d-pad-btn" id="btn-a">◀</div>
        <div class="d-pad-btn" id="btn-s">▼</div>
        <div class="d-pad-btn" id="btn-d">▶</div>
      </div>
    </div>

    <div class="absolute bottom-6 right-6 flex flex-col gap-3 pointer-events-auto md:hidden items-end z-30">
      <div class="flex gap-3">
        <button id="btn-shop" class="action-btn bg-yellow-500/20 border-yellow-400 text-yellow-300">🛒</button>
        <button id="btn-kimi" class="action-btn bg-pink-500/20 border-pink-400 text-pink-300">🤖</button>
      </div>
      <div class="flex gap-3">
        <button id="btn-car" class="action-btn bg-blue-500/20 border-blue-400 text-blue-300 hidden">🚗</button>
        <button id="btn-e" class="action-btn bg-cyan-500/20 border-cyan-400 text-cyan-300 hidden">E</button>
        <button id="btn-shoot" class="action-btn bg-red-500/20 border-red-400 text-red-300 text-3xl">🔫</button>
      </div>
    </div>
  </div>

  <!-- SHOP PANEL -->
  <div id="shop-panel" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-md glass p-6 rounded-xl z-50 hidden border-2 border-yellow-500/50">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-display text-2xl text-yellow-400">BLACK MARKET</h3>
      <button id="close-shop" class="text-white text-2xl px-2 hover:text-red-400">✕</button>
    </div>
    <div class="space-y-3" id="shop-items"></div>
  </div>

  <!-- KIMI PANEL -->
  <div id="kimi-panel" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm glass p-4 rounded-xl z-50 hidden border-2 border-pink-500/50">
    <div class="flex justify-between items-center mb-2">
      <h3 class="font-display text-pink-400">KIMI AI</h3>
      <button id="close-kimi" class="text-white text-xl px-2 hover:text-red-400">✕</button>
    </div>
    <div id="kimi-msg" class="text-sm text-cyan-100 h-32 overflow-y-auto mb-3 bg-black/50 p-3 rounded border border-gray-700">
      Systems online. I can assist with combat tactics, vehicle locations, and economy tips.
    </div>
    <div class="flex gap-2">
      <input id="kimi-input" type="text" placeholder="Ask me..." class="flex-1 bg-black/50 border border-pink-500/50 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-400">
      <button id="kimi-send" class="bg-pink-500/20 border border-pink-500 px-4 rounded text-pink-300 font-bold hover:bg-pink-500/40">SEND</button>
    </div>
  </div>

  <script>
    // --- GAME STATE ---
    let scene, camera, renderer, player, car, clock;
    let money = 1000;
    let health = 100;
    let selectedChar = null;
    let keys = { w: false, a: false, s: false, d: false };
    let missions = [], enemies = [], particles = [];
    let nearbyMission = null, nearbyCar = null;
    let isDriving = false;
    let isPaused = false;
    let lastShootTime = 0;
    let walkTime = 0;
    
    let weapons = [
      { name: 'Fists', damage: 0, range: 0, cooldown: 500, price: 0, owned: true },
      { name: 'Pistol', damage: 34, range: 60, cooldown: 350, price: 0, owned: true },
      { name: 'SMG', damage: 15, range: 80, cooldown: 100, price: 1500, owned: false },
      { name: 'Pulse Rifle', damage: 100, range: 150, cooldown: 700, price: 4000, owned: false }
    ];
    let currentWeapon = weapons[1];

    const characters = [
      { id: 'fixer', name: 'THE FIXER', color: '#ff3366', desc: 'Earns 20% more from missions.' },
      { id: 'ghost', name: 'THE GHOST', color: '#00f0ff', desc: 'Takes 20% less damage.' },
      { id: 'netrunner', name: 'NETRUNNER', color: '#b44cff', desc: 'Weapons cooldown 20% faster.' }
    ];

    // --- INITIALIZATION ---
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('char-screen').classList.remove('hidden');
        buildCharacterCards();
      }, 1000);
    };

    function buildCharacterCards() {
      const container = document.getElementById('char-container');
      container.innerHTML = '';
      characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'glass p-6 rounded-2xl cursor-pointer hover:scale-105 transition-all text-center w-full md:w-64 border-2 border-transparent hover:border-cyan-400';
        card.innerHTML = `
          <div class="w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center" style="background:radial-gradient(circle, ${char.color}88, transparent); box-shadow: 0 0 30px ${char.color}; border: 2px solid ${char.color};">
             <div class="w-10 h-10 rounded-full" style="background:${char.color};"></div>
          </div>
          <h3 class="font-display text-xl mb-2" style="color:${char.color};">${char.name}</h3>
          <p class="text-sm text-gray-300">${char.desc}</p>
        `;
        card.onclick = () => startGame(char);
        container.appendChild(card);
      });
    }

    // --- START / RESTART GAME ---
    function startGame(char) {
      // Reset state
      selectedChar = char;
      money = 1000;
      health = 100;
      isPaused = false;
      isDriving = false;
      missions = []; enemies = []; particles = [];
      
      // Reset UI
      document.getElementById('char-screen').classList.add('hidden');
      document.getElementById('game-ui').classList.remove('hidden');
      document.getElementById('crosshair').classList.remove('hidden');
      document.getElementById('ui-char').innerText = char.name;
      document.getElementById('ui-char').style.color = char.color;
      document.getElementById('prompt').classList.add('hidden');
      updateUI();

      // Clear old 3D scene if it exists
      if(renderer) {
        renderer.dispose();
        document.body.removeChild(renderer.domElement);
      }

      // 1. Setup Three.js 
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x05070d, 0.015); 
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x05070d);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 2. Lighting
      scene.add(new THREE.AmbientLight(0x111122, 1.5)); 
      const dirLight = new THREE.DirectionalLight(0x8899ff, 0.8);
      dirLight.position.set(20, 50, -20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // 3. World
      buildCity();
      buildCar();
      buildPlayer();

      // 4. Entities
      spawnMission(10, 10);
      spawnMission(-25, 15);
      spawnEnemy();

      // 5. Loop
      setupControls();
      clock = new THREE.Clock();
      animate();
    }

    // --- BUILDING THE WORLD (High Detail) ---
    function buildCity() {
      // Ground
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(500, 500),
        new THREE.MeshStandardMaterial({ color: 0x05070a, roughness: 0.1, metalness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // Road lines
      for(let i=-200; i<200; i+=10) {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 4), new THREE.MeshBasicMaterial({color: 0x00f0ff, opacity: 0.3, transparent: true}));
        line.rotation.x = -Math.PI / 2;
        line.position.set(0, 0.05, i);
        scene.add(line);
      }

      function createWindowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#020305'; ctx.fillRect(0,0,64,64); 
        for(let i=0; i<8; i++) {
          for(let j=0; j<8; j++) {
            if(Math.random() > 0.6) {
              ctx.fillStyle = Math.random() > 0.5 ? '#00f0ff' : '#ff00a0';
              ctx.fillRect(i*8+2, j*8+4, 4, 2);
            }
          }
        }
        return new THREE.CanvasTexture(canvas);
      }

      for (let x = -80; x <= 80; x += 25) {
        for (let z = -80; z <= 80; z += 25) {
          if (Math.abs(x) < 15 && Math.abs(z) < 15) continue; 
          if (Math.random() > 0.8) continue;
          
          const h = 20 + Math.random() * 60;
          const w = 8 + Math.random() * 6;
          const neon = Math.random() > 0.5 ? 0x00f0ff : 0xff00a0;
          
          const tex = createWindowTexture();
          tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(2, Math.floor(h/5));

          const mat = new THREE.MeshStandardMaterial({ 
            map: tex, color: 0xffffff, emissive: neon, emissiveIntensity: 0.15, roughness: 0.6, metalness: 0.5 
          });
          
          const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat);
          b.position.set(x, h/2, z);
          b.castShadow = true;
          b.receiveShadow = true;
          scene.add(b);
          
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(b.geometry), 
            new THREE.LineBasicMaterial({ color: neon, transparent: true, opacity: 0.6 })
          );
          b.add(edges);
        }
      }
    }

    function buildCar() {
      car = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 1, roughness: 0.1 });
      
      const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.5), bodyMat);
      base.position.y = 0.6; base.castShadow = true;
      
      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.2, 1.6), bodyMat);
      hood.position.set(0, 0.8, 1.4);
      
      const trunk = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.3, 1.0), bodyMat);
      trunk.position.set(0, 0.85, -1.6);

      const glassMat = new THREE.MeshStandardMaterial({ color: 0x001122, metalness: 1, roughness: 0, transparent: true, opacity: 0.8 });
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 1.8), glassMat);
      cabin.position.set(0, 1.2, -0.2);

      // Wheels with rims
      car.wheels = [];
      [[-1.1, 0.4, 1.4], [1.1, 0.4, 1.4], [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]].forEach(pos => {
        const wheel = new THREE.Group();
        const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        tire.rotation.z = Math.PI / 2;
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.32, 8), new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.5 }));
        rim.rotation.z = Math.PI / 2;
        wheel.add(tire, rim);
        wheel.position.set(...pos);
        car.add(wheel);
        car.wheels.push(wheel);
      });

      // Lights
      const hlMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
      const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), hlMat); hl1.position.set(-0.7, 0.8, 2.25);
      const hl2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), hlMat); hl2.position.set(0.7, 0.8, 2.25);
      const tl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0xff00a0 })); tl.position.set(0, 0.8, -2.25);
      
      car.add(base, hood, trunk, cabin, hl1, hl2, tl);
      
      car.position.set(8, 0, 0);
      scene.add(car);
    }

    function buildPlayer() {
      player = new THREE.Group();
      
      // Clothes and Skin
      const suitMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.5 });
      const neonMat = new THREE.MeshStandardMaterial({ color: selectedChar.color, emissive: selectedChar.color, emissiveIntensity: 1 });

      // Torso & Head
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.4), suitMat); torso.position.y = 1.1; torso.castShadow = true;
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat); head.position.y = 1.75;
      
      // Visor
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.1), neonMat); visor.position.set(0, 1.75, 0.2);

      // Limbs (Groups for animation)
      player.lArm = new THREE.Group();
      player.rArm = new THREE.Group();
      player.lLeg = new THREE.Group();
      player.rLeg = new THREE.Group();

      const armGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
      const legGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);

      const laMesh = new THREE.Mesh(armGeo, suitMat); laMesh.position.y = -0.35; player.lArm.add(laMesh);
      
      // Right arm holds the gun
      const raMesh = new THREE.Mesh(armGeo, suitMat); raMesh.position.y = -0.35; 
      const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.4), new THREE.MeshStandardMaterial({color: 0x333333}));
      gun.position.set(0, -0.6, 0.2);
      player.rArm.add(raMesh, gun);

      const llMesh = new THREE.Mesh(legGeo, suitMat); llMesh.position.y = -0.4; player.lLeg.add(llMesh);
      const rlMesh = new THREE.Mesh(legGeo, suitMat); rlMesh.position.y = -0.4; player.rLeg.add(rlMesh);

      player.lArm.position.set(-0.45, 1.4, 0);
      player.rArm.position.set(0.45, 1.4, 0);
      player.lLeg.position.set(-0.18, 0.8, 0);
      player.rLeg.position.set(0.18, 0.8, 0);

      player.add(torso, head, visor, player.lArm, player.rArm, player.lLeg, player.rLeg);
      scene.add(player);
    }

    // --- ENTITIES ---
    function spawnMission(x, z) {
      const group = new THREE.Group();
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.1, 16, 32), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
      ring.rotation.x = Math.PI / 2;
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 20, 8), new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.2 }));
      beam.position.y = 10;
      group.add(ring, beam);
      group.position.set(x, 1.5, z);
      scene.add(group);
      missions.push(group);
    }

    function spawnEnemy() {
      const enemy = new THREE.Group();
      const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6), new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1.5 }));
      const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 8, 32), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.05, 8, 32), new THREE.MeshBasicMaterial({ color: 0xff00a0 }));
      ring2.rotation.x = Math.PI / 2;
      enemy.add(core, ring1, ring2);
      enemy.userData = { hp: 100, ring1: ring1, ring2: ring2 };
      enemy.position.set((Math.random() - 0.5) * 60, 3, (Math.random() - 0.5) * 60);
      scene.add(enemy);
      enemies.push(enemy);
    }

    // --- COMBAT ---
    function createExplosion(pos, color) {
      for(let i=0; i<15; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: color }));
        p.position.copy(pos);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15), life: 1.0 };
        scene.add(p);
        particles.push(p);
      }
    }

    function shoot() {
      if (isDriving || currentWeapon.name === 'Fists' || isPaused) return;
      const now = performance.now();
      if (now - lastShootTime < currentWeapon.cooldown) return;
      lastShootTime = now;

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const startPos = player.position.clone().add(new THREE.Vector3(0, 1.5, 0));
      const endPos = startPos.clone().add(raycaster.ray.direction.clone().multiplyScalar(currentWeapon.range));
      
      const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([startPos, endPos]), new THREE.LineBasicMaterial({ color: 0x00f0ff }));
      scene.add(line);
      setTimeout(() => scene.remove(line), 40);

      const hits = raycaster.intersectObjects(enemies, true);
      if (hits.length > 0) {
        let enemy = hits[0].object;
        while (enemy.parent && !enemies.includes(enemy)) enemy = enemy.parent;
        if (enemies.includes(enemy)) {
          enemy.userData.hp -= currentWeapon.damage;
          createExplosion(hits[0].point, 0xffaa00);
          if (enemy.userData.hp <= 0) {
            createExplosion(enemy.position, 0xff0000);
            scene.remove(enemy);
            enemies = enemies.filter(e => e !== enemy);
            money += 250;
            updateUI();
            setTimeout(spawnEnemy, 2000);
          }
        }
      }
    }

    // --- UI / CONTROLS ---
    function updateUI() {
      document.getElementById('ui-money').innerText = money;
      document.getElementById('ui-health').innerText = Math.max(0, Math.floor(health)) + '%';
      document.getElementById('ui-weapon').innerText = currentWeapon.name;
    }

    function toggleCar() {
      if ((nearbyCar || isDriving) && !isPaused) {
        isDriving = !isDriving;
        player.visible = !isDriving;
        if (isDriving) {
          player.position.copy(car.position);
          document.getElementById('btn-car').classList.add('bg-green-500/40', 'border-green-400');
          document.getElementById('crosshair').classList.add('hidden');
        } else {
          player.position.copy(car.position).add(new THREE.Vector3(2.5, 0, 0));
          document.getElementById('btn-car').classList.remove('bg-green-500/40', 'border-green-400');
          document.getElementById('crosshair').classList.remove('hidden');
        }
      }
    }

    function collectMission(marker) {
      let payout = selectedChar.id === 'fixer' ? 600 : 500;
      money += payout;
      updateUI();
      createExplosion(marker.position, 0x00f0ff);
      scene.remove(marker);
      missions = missions.filter(m => m !== marker);
      nearbyMission = null;
      document.getElementById('prompt').classList.add('hidden');
      document.getElementById('btn-e').classList.add('hidden');
      setTimeout(() => spawnMission((Math.random() - 0.5) * 100, (Math.random() - 0.5) * 100), 1500);
    }

    function setupControls() {
      window.addEventListener('keydown', e => {
        if (isPaused) return;
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = true;
        if (k === 'e') {
          if (nearbyMission) collectMission(nearbyMission);
          if (nearbyCar && !isDriving) toggleCar();
        }
        if (k === 'f' && !isDriving) toggleCar();
        if (k === ' ') shoot();
      });
      window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if (keys.hasOwnProperty(k)) keys[k] = false;
      });

      const bindTouch = (id, key) => {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); if(!isPaused) keys[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
      };
      bindTouch('btn-w', 'w'); bindTouch('btn-a', 'a'); bindTouch('btn-s', 's'); bindTouch('btn-d', 'd');

      document.getElementById('btn-e').addEventListener('touchstart', (e) => { e.preventDefault(); if(!isPaused && nearbyMission) collectMission(nearbyMission); });
      document.getElementById('btn-shoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
      document.getElementById('btn-car').addEventListener('touchstart', (e) => { e.preventDefault(); toggleCar(); });

      // EXIT BUTTON (Fixes "Cannot go back" issue)
      document.getElementById('btn-pause').onclick = () => {
        isPaused = true;
        keys = { w: false, a: false, s: false, d: false }; // clear movement
        document.getElementById('game-ui').classList.add('hidden');
        document.getElementById('char-screen').classList.remove('hidden');
      };

      document.getElementById('btn-kimi').onclick = () => document.getElementById('kimi-panel').classList.remove('hidden');
      document.getElementById('close-kimi').onclick = () => document.getElementById('kimi-panel').classList.add('hidden');
      document.getElementById('btn-shop').onclick = () => { document.getElementById('shop-panel').classList.remove('hidden'); buildShop(); };
      document.getElementById('close-shop').onclick = () => document.getElementById('shop-panel').classList.add('hidden');

      document.getElementById('kimi-send').onclick = () => {
        const input = document.getElementById('kimi-input');
        if(!input.value) return;
        const msg = document.getElementById('kimi-msg');
        msg.innerHTML += `<br><span class="text-white">You: ${input.value}</span>`;
        let reply = "Data not found. Try asking about weapons, cars, or missions.";
        const q = input.value.toLowerCase();
        if(q.includes('gun') || q.includes('weapon')) reply = "Upgrade your loadout at the Black Market.";
        if(q.includes('car') || q.includes('drive')) reply = "Press 🚗 when close to the vehicle.";
        msg.innerHTML += `<br><span class="text-pink-300">Kimi: ${reply}</span>`;
        input.value = '';
        msg.scrollTop = msg.scrollHeight;
      };

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function buildShop() {
      const list = document.getElementById('shop-items');
      list.innerHTML = '';
      weapons.forEach((w) => {
        const btn = document.createElement('button');
        btn.className = `w-full p-3 rounded-lg text-left flex justify-between items-center transition-colors ${w.owned ? 'bg-cyan-900/50 border border-cyan-500' : 'bg-black/60 border border-gray-600'}`;
        btn.innerHTML = `
          <div>
            <div class="font-display ${w.owned ? 'text-cyan-300' : 'text-gray-300'}">${w.name}</div>
            <div class="text-xs text-gray-400">DMG: ${w.damage}</div>
          </div>
          <div class="text-pink-400 font-display font-bold">${w.owned ? (currentWeapon.name === w.name ? 'EQUIPPED' : 'EQUIP') : '$'+w.price}</div>
        `;
        btn.onclick = () => {
          if (w.owned) currentWeapon = w;
          else if (money >= w.price) { money -= w.price; w.owned = true; currentWeapon = w; updateUI(); }
          buildShop();
        };
        list.appendChild(btn);
      });
    }

    // --- GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      if (isPaused || !player) return;

      const dt = Math.min(clock.getDelta(), 0.1);
      const activeObj = isDriving ? car : player;
      const speed = isDriving ? 40 : 15;
      
      let moving = false;
      if (keys.w) { activeObj.position.z -= speed * dt; moving = true; }
      if (keys.s) { activeObj.position.z += speed * dt; moving = true; }
      if (keys.a) { activeObj.position.x -= speed * dt; moving = true; }
      if (keys.d) { activeObj.position.x += speed * dt; moving = true; }

      if (!isDriving) {
        if (moving) {
          walkTime += dt * 10;
          player.lArm.rotation.x = Math.sin(walkTime) * 0.5;
          player.rArm.rotation.x = -Math.sin(walkTime) * 0.5;
          player.lLeg.rotation.x = -Math.sin(walkTime) * 0.5;
          player.rLeg.rotation.x = Math.sin(walkTime) * 0.5;
          if (keys.w) player.rotation.y = 0;
          if (keys.s) player.rotation.y = Math.PI;
          if (keys.a) player.rotation.y = Math.PI / 2;
          if (keys.d) player.rotation.y = -Math.PI / 2;
        } else {
          player.lArm.rotation.x = 0; player.rArm.rotation.x = 0;
          player.lLeg.rotation.x = 0; player.rLeg.rotation.x = 0;
        }
      } else {
        if (moving) car.wheels.forEach(w => w.rotation.x -= 10 * dt);
        if (keys.a) car.rotation.y += 2 * dt;
        if (keys.d) car.rotation.y -= 2 * dt;
      }

      for(let i=particles.length-1; i>=0; i--) {
        const p = particles[i];
        p.position.add(p.userData.vel.clone().multiplyScalar(dt));
        p.userData.vel.y -= 9.8 * dt;
        p.userData.life -= dt;
        p.scale.setScalar(p.userData.life);
        if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
      }

      enemies.forEach(enemy => {
        enemy.userData.ring1.rotation.x += dt * 2;
        enemy.userData.ring2.rotation.y += dt * 2;
        enemy.position.y = 3 + Math.sin(clock.getElapsedTime() * 2) * 0.5;
        const dir = activeObj.position.clone().sub(enemy.position).normalize();
        enemy.position.add(dir.multiplyScalar(6 * dt));
        if (activeObj.position.distanceTo(enemy.position) < 3) {
          let dmg = 20 * dt;
          if (selectedChar.id === 'ghost') dmg *= 0.8; 
          health -= dmg;
          updateUI();
          if(health <= 0) {
            health = 100; player.position.set(0,0,0); car.position.set(8,0,0);
            if(isDriving) toggleCar();
            updateUI();
          }
        }
      });

      let minDist = 5;
      nearbyMission = null; nearbyCar = null;
      missions.forEach(m => {
        m.rotation.z += dt * 2;
        if (activeObj.position.distanceTo(m.position) < minDist) nearbyMission = m;
      });
      if (!isDriving && player.position.distanceTo(car.position) < 5) nearbyCar = car;

      const prompt = document.getElementById('prompt');
      if (nearbyMission || nearbyCar) {
        prompt.classList.remove('hidden');
        if (nearbyMission) {
          document.getElementById('prompt-text').innerText = "COLLECT DATA";
          document.getElementById('btn-e').classList.remove('hidden');
          document.getElementById('btn-car').classList.add('hidden');
        } else {
          document.getElementById('prompt-text').innerText = "ENTER VEHICLE";
          document.getElementById('btn-car').classList.remove('hidden');
          document.getElementById('btn-e').classList.add('hidden');
        }
      } else {
        prompt.classList.add('hidden');
        document.getElementById('btn-e').classList.add('hidden');
        document.getElementById('btn-car').classList.add('hidden');
      }

      const camHeight = isDriving ? 8 : 6;
      const camDist = isDriving ? 14 : 10;
      camera.position.lerp(new THREE.Vector3(activeObj.position.x, activeObj.position.y + camHeight, activeObj.position.z + camDist), 5 * dt);
      camera.lookAt(activeObj.position.x, activeObj.position.y + 1.5, activeObj.position.z);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
